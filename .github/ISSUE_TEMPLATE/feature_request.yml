name: Feature request
description: Suggest a focused improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: Describe the problem or workflow rather than only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
  - type: textarea
    id: tradeoffs
    attributes:
      label: Windows compatibility or resource tradeoffs
