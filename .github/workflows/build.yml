name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025-vs2026
          - arch: x86
            runner: windows-2025-vs2026
          - arch: arm64
            runner: windows-11-vs2026-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Build application
        shell: pwsh
        run: .\build.ps1 -Architecture '${{ matrix.arch }}' -OutputDirectory 'out\${{ matrix.arch }}'
      - name: Run native regression
        shell: pwsh
        run: .\build.ps1 -Test -Architecture '${{ matrix.arch }}' -OutputDirectory 'out\tests-${{ matrix.arch }}'
      - name: Package portable archive
        shell: pwsh
        run: .\scripts\package.ps1 -Architecture '${{ matrix.arch }}' -BinaryPath 'out\${{ matrix.arch }}\FloatNote.exe' -OutputDirectory artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: FloatNote-windows-${{ matrix.arch }}
          path: artifacts/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: FloatNote-windows-*
          path: release
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: cd release && sha256sum *.zip > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS.txt --verify-tag --title "FloatNote $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
